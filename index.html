<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hand Theremin</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:100vw;height:100vh;overflow:hidden;background:#0a0a14;font-family:system-ui,sans-serif;user-select:none}
.container{position:relative;width:100%;height:100%}
#webcam{position:absolute;width:100%;height:100%;object-fit:cover;transform:scaleX(-1);opacity:.6}
#hand-canvas{position:absolute;top:0;left:0;width:100%;height:100%;transform:scaleX(-1);pointer-events:none}
#three-container{position:absolute;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:2}
.hud{position:absolute;z-index:10;pointer-events:none}
#status-bar{top:24px;left:24px;display:flex;gap:12px;align-items:center}
.gesture-badge{padding:8px 18px;border-radius:20px;font-size:14px;font-weight:600;background:rgba(0,0,0,.55);backdrop-filter:blur(12px);color:#aaa;border:1px solid rgba(255,255,255,.08);transition:all .3s}
.gesture-badge.active{color:#fff;border-color:rgba(255,255,255,.25)}
.gesture-badge.fist{background:rgba(255,80,80,.25)}
.gesture-badge.open{background:rgba(80,255,120,.2)}
#note-display{top:24px;right:24px;font-size:56px;font-weight:700;color:rgba(255,255,255,.9);text-shadow:0 0 40px rgba(120,180,255,.6);letter-spacing:-1px;transition:all .15s}
#freq-display{top:90px;right:24px;font-size:13px;color:rgba(255,255,255,.45);text-align:right}
#pitch-rail{bottom:60px;left:50%;transform:translateX(-50%);width:70%;max-width:600px;height:6px;border-radius:3px;background:rgba(255,255,255,.08)}
#pitch-thumb{position:absolute;top:-10px;width:26px;height:26px;border-radius:50%;background:#fff;box-shadow:0 0 30px rgba(120,200,255,.7);transition:left .12s;transform:translateX(-50%)}
#hint{bottom:100px;left:50%;transform:translateX(-50%);font-size:13px;color:rgba(255,255,255,.3);text-align:center;white-space:nowrap}
#loading{position:absolute;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0a0a14;color:#fff;font-size:18px;gap:16px}
#loading.hidden{display:none}
.spinner{width:36px;height:36px;border:3px solid rgba(255,255,255,.15);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="loading"><div class="spinner"></div><span id="loading-text">Loading MediaPipe...</span></div>
<div class="container">
<video id="webcam" autoplay playsinline></video>
<canvas id="hand-canvas"></canvas>
<div id="three-container"></div>
<div id="status-bar" class="hud"><div id="badge-fist" class="gesture-badge">Fist</div><div id="badge-open" class="gesture-badge">Open</div></div>
<div id="note-display" class="hud">--</div>
<div id="freq-display" class="hud">-- Hz</div>
<div id="pitch-rail" class="hud"><div id="pitch-thumb"></div></div>
<div id="hint" class="hud">Fist = Mute | Open = Play | Move = Pitch</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="app.js"></script>
</body>
</html>
